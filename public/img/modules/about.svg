<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="55%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#03060f"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#00ff9d" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00e5ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="55%" stop-color="#060b18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#01030a" stop-opacity=".92"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#sky)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <rect width="1200" height="560" fill="url(#halo)"/>
  <g><circle cx="935" cy="196" r="1.6" fill="#00e5ff" opacity="0.26"/><circle cx="367" cy="497" r="1.6" fill="#00e5ff" opacity="0.24"/><circle cx="601" cy="449" r="1.2" fill="#00e5ff" opacity="0.53"/><circle cx="928" cy="132" r="3.0" fill="#00ff9d" opacity="0.26"/><circle cx="138" cy="414" r="3.0" fill="#00ff9d" opacity="0.27"/><circle cx="131" cy="136" r="3.0" fill="#00e5ff" opacity="0.43"/><circle cx="152" cy="425" r="1.6" fill="#00e5ff" opacity="0.49"/><circle cx="146" cy="261" r="1.2" fill="#00e5ff" opacity="0.57"/><circle cx="1130" cy="171" r="1.2" fill="#00e5ff" opacity="0.33"/><circle cx="968" cy="410" r="3.0" fill="#00e5ff" opacity="0.50"/><circle cx="635" cy="145" r="3.0" fill="#00ff9d" opacity="0.35"/><circle cx="940" cy="46" r="1.2" fill="#00e5ff" opacity="0.20"/><circle cx="875" cy="405" r="3.0" fill="#00e5ff" opacity="0.23"/><circle cx="1054" cy="370" r="1.2" fill="#00e5ff" opacity="0.45"/><circle cx="773" cy="111" r="1.2" fill="#00e5ff" opacity="0.19"/><circle cx="435" cy="431" r="3.0" fill="#00ff9d" opacity="0.42"/><circle cx="579" cy="405" r="1.2" fill="#00ff9d" opacity="0.47"/><circle cx="787" cy="264" r="3.0" fill="#00ff9d" opacity="0.59"/><circle cx="998" cy="155" r="1.6" fill="#00ff9d" opacity="0.50"/><circle cx="224" cy="52" r="1.6" fill="#00e5ff" opacity="0.46"/><circle cx="1123" cy="317" r="3.0" fill="#00ff9d" opacity="0.39"/><circle cx="980" cy="89" r="3.0" fill="#00ff9d" opacity="0.30"/><circle cx="548" cy="131" r="3.0" fill="#00ff9d" opacity="0.21"/><circle cx="198" cy="83" r="1.2" fill="#00e5ff" opacity="0.39"/><circle cx="913" cy="119" r="3.0" fill="#00e5ff" opacity="0.30"/><circle cx="636" cy="433" r="3.0" fill="#00e5ff" opacity="0.26"/></g>
