<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="55%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#03060f"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#00e5ff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00ff9d" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="55%" stop-color="#060b18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#01030a" stop-opacity=".92"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#sky)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <rect width="1200" height="560" fill="url(#halo)"/>
  <g><circle cx="485" cy="131" r="1.6" fill="#00ff9d" opacity="0.44"/><circle cx="820" cy="449" r="3.0" fill="#00ff9d" opacity="0.24"/><circle cx="177" cy="107" r="1.6" fill="#00e5ff" opacity="0.37"/><circle cx="528" cy="187" r="1.2" fill="#00ff9d" opacity="0.38"/><circle cx="108" cy="473" r="1.6" fill="#00e5ff" opacity="0.37"/><circle cx="238" cy="47" r="1.6" fill="#00ff9d" opacity="0.59"/><circle cx="1106" cy="416" r="1.2" fill="#00ff9d" opacity="0.52"/><circle cx="613" cy="267" r="1.2" fill="#00e5ff" opacity="0.39"/><circle cx="195" cy="246" r="2.2" fill="#00ff9d" opacity="0.48"/><circle cx="1031" cy="90" r="1.2" fill="#00e5ff" opacity="0.34"/><circle cx="282" cy="249" r="1.2" fill="#00ff9d" opacity="0.54"/><circle cx="679" cy="330" r="3.0" fill="#00e5ff" opacity="0.25"/><circle cx="521" cy="403" r="2.2" fill="#00e5ff" opacity="0.35"/><circle cx="375" cy="248" r="1.6" fill="#00ff9d" opacity="0.57"/><circle cx="79" cy="195" r="1.6" fill="#00ff9d" opacity="0.40"/><circle cx="917" cy="176" r="1.2" fill="#00e5ff" opacity="0.49"/><circle cx="436" cy="468" r="1.6" fill="#00e5ff" opacity="0.49"/><circle cx="569" cy="105" r="3.0" fill="#00ff9d" opacity="0.20"/><circle cx="1099" cy="287" r="1.6" fill="#00ff9d" opacity="0.49"/><circle cx="581" cy="366" r="2.2" fill="#00ff9d" opacity="0.22"/><circle cx="632" cy="310" r="3.0" fill="#00ff9d" opacity="0.26"/><circle cx="88" cy="196" r="1.6" fill="#00ff9d" opacity="0.47"/><circle cx="890" cy="268" r="3.0" fill="#00ff9d" opacity="0.42"/><circle cx="472" cy="369" r="1.2" fill="#00ff9d" opacity="0.31"/><circle cx="1151" cy="515" r="3.0" fill="#00e5ff" opacity="0.33"/><circle cx="811" cy="233" r="2.2" fill="#00e5ff" opacity="0.43"/></g>
  <g transform="translate(0,-110)">
    <g filter="url(#glow)">
      <rect x="360" y="270" width="440" height="290" rx="18"
            fill="#0a1424" fill-opacity=".95" stroke="url(#stroke)" stroke-width="3"/>
      <path d="M360 292 L580 452 L800 292" fill="none" stroke="url(#stroke)" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M360 540 L520 400 M800 540 L640 400" fill="none" stroke="#00ff9d"
            stroke-opacity=".35" stroke-width="3"/>
    </g>
    <g><path d="M872 300 m 0 -54 a 54 54 0 0 1 0 108" fill="none" stroke="#00e5ff" stroke-opacity="0.50" stroke-width="4" stroke-linecap="round"/><path d="M872 300 m 0 -96 a 96 96 0 0 1 0 192" fill="none" stroke="#00e5ff" stroke-opacity="0.39" stroke-width="4" stroke-linecap="round"/><path d="M872 300 m 0 -138 a 138 138 0 0 1 0 276" fill="none" stroke="#00e5ff" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round"/></g>
    <circle cx="872" cy="300" r="16" fill="#00ff9d" filter="url(#glow)"/>
    <g opacity=".8">
      <rect x="300" y="628" width="180" height="12" rx="6" fill="#00ff9d" opacity=".3"/>
      <rect x="300" y="656" width="120" height="10" rx="5" fill="#00e5ff" opacity=".26"/>
    </g>
</g>
  <rect width="1200" height="560" fill="url(#vig)"/>
  <rect x="1" y="1" width="1198" height="558" fill="none"
        stroke="#ffffff" stroke-opacity=".07" stroke-width="2" rx="4"/>
</svg>
