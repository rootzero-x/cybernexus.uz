<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="55%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#03060f"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#00ff9d" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00e5ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>

    <radialGradient id="vig" cx="50%" cy="46%" r="62%">
      <stop offset="55%" stop-color="#060b18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#01030a" stop-opacity=".92"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#sky)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <rect width="1200" height="560" fill="url(#halo)"/>
  <g><circle cx="141" cy="496" r="1.6" fill="#00ff9d" opacity="0.60"/><circle cx="129" cy="128" r="1.2" fill="#00e5ff" opacity="0.33"/><circle cx="1122" cy="358" r="3.0" fill="#00ff9d" opacity="0.34"/><circle cx="845" cy="246" r="1.2" fill="#00ff9d" opacity="0.45"/><circle cx="298" cy="379" r="3.0" fill="#00ff9d" opacity="0.53"/><circle cx="300" cy="281" r="3.0" fill="#00e5ff" opacity="0.26"/><circle cx="500" cy="187" r="1.2" fill="#00e5ff" opacity="0.22"/><circle cx="388" cy="214" r="1.6" fill="#00ff9d" opacity="0.28"/><circle cx="224" cy="188" r="1.6" fill="#00ff9d" opacity="0.36"/><circle cx="186" cy="375" r="3.0" fill="#00e5ff" opacity="0.53"/><circle cx="870" cy="232" r="1.2" fill="#00e5ff" opacity="0.29"/><circle cx="823" cy="183" r="2.2" fill="#00e5ff" opacity="0.23"/><circle cx="925" cy="278" r="1.2" fill="#00e5ff" opacity="0.38"/><circle cx="180" cy="148" r="3.0" fill="#00ff9d" opacity="0.38"/><circle cx="350" cy="510" r="2.2" fill="#00ff9d" opacity="0.53"/><circle cx="436" cy="473" r="1.2" fill="#00e5ff" opacity="0.19"/><circle cx="264" cy="197" r="2.2" fill="#00ff9d" opacity="0.58"/><circle cx="764" cy="140" r="1.6" fill="#00ff9d" opacity="0.26"/><circle cx="1151" cy="206" r="3.0" fill="#00e5ff" opacity="0.18"/><circle cx="665" cy="326" r="2.2" fill="#00ff9d" opacity="0.26"/><circle cx="789" cy="496" r="3.0" fill="#00e5ff" opacity="0.26"/><circle cx="270" cy="287" r="1.6" fill="#00e5ff" opacity="0.38"/><circle cx="727" cy="410" r="3.0" fill="#00ff9d" opacity="0.19"/><circle cx="144" cy="210" r="3.0" fill="#00e5ff" opacity="0.60"/><circle cx="125" cy="442" r="1.6" fill="#00ff9d" opacity="0.36"/><circle cx="885" cy="388" r="2.2" fill="#00e5ff" opacity="0.49"/></g>
  <g transform="translate(0,-110)">
    <g filter="url(#glow)"><path d="M600 300 m -90 0 a 90 90 0 0 1 180 0" fill="none" stroke="#00e5ff" stroke-opacity="0.50" stroke-width="4" stroke-linecap="round"/><path d="M600 300 m -150 0 a 150 150 0 0 1 300 0" fill="none" stroke="#00e5ff" stroke-opacity="0.41" stroke-width="4" stroke-linecap="round"/><path d="M600 300 m -210 0 a 210 210 0 0 1 420 0" fill="none" stroke="#00e5ff" stroke-opacity="0.32" stroke-width="4" stroke-linecap="round"/><path d="M600 300 m -270 0 a 270 270 0 0 1 540 0" fill="none" stroke="#00e5ff" stroke-opacity="0.23" stroke-width="4" stroke-linecap="round"/></g>
    <g>
      <path d="M600 300 L560 460 L640 460 Z" fill="url(#stroke)" opacity=".9"/>
      <circle cx="600" cy="292" r="17" fill="#00ff9d"/>
      <circle cx="600" cy="292" r="30" fill="none" stroke="#00ff9d" stroke-opacity=".45" stroke-width="3"/>
    </g>
    <g>
      <rect x="400" y="440" width="400" height="220" rx="16"
            fill="#0a1424" fill-opacity=".9" stroke="#00ff9d" stroke-opacity=".4" stroke-width="2"/>
      <rect x="430" y="470" width="330" height="13" rx="6" fill="#ffffff" opacity="0.22"/><rect x="450" y="504" width="260" height="13" rx="6" fill="#ffffff" opacity="0.19"/><rect x="430" y="538" width="190" height="13" rx="6" fill="#ffffff" opacity="0.16"/><rect x="450" y="572" width="330" height="13" rx="6" fill="#ffffff" opacity="0.13"/><rect x="430" y="606" width="260" height="13" rx="6" fill="#ffffff" opacity="0.10"/>
